# 404 FOUNDERS — Default System Configuration
env: development
operating_mode: hybrid # Options: general | personal | hybrid
log_level: INFO
log_format: json # Options: json | console

security:
  default_tier: read_only # Options: read_only | protected | privileged | dangerous
  require_user_confirmation: true
  audit_log_enabled: true
  audit_log_path: logs/security_audit.log
  allowed_read_paths:
    - /proc
    - /sys
    - .
  forbidden_commands:
    - "rm -rf"
    - "mkfs"
    - "dd"
    - "shutdown"
    - "reboot"
    - ":(){ :|:& };:"

compute:
  backend: cpu # Options: cpu | cuda | jax
  max_local_memory_mb: 4096
  max_cpu_threads: 8
  quantization_bits: 4

api:
  rest_host: 127.0.0.1
  rest_port: 8000
  ws_port: 8001
  grpc_port: 50051

memory:
  max_short_term_tokens: 8192
  long_term_vector_dim: 768
  consolidation_interval_seconds: 300
