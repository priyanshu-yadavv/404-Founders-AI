# 404 FOUNDERS — Distributed Device Mesh & Communication Topology Configuration
device_mesh:
  cluster_target: "TIER_C_FOUNDATION"
  total_gpus: 64
  mesh_shape: [8, 4, 2, 1] # [data_parallel, tensor_parallel, pipeline_parallel, sequence_parallel]
  dim_names: ["dp", "tp", "pp", "sp"]

communication:
  gpu_backend: "nccl"
  cpu_backend: "gloo"
  nccl_settings:
    NCCL_DEBUG: "INFO"
    NCCL_IB_DISABLE: 0
    NCCL_IB_HCA: "mlx5_0,mlx5_1,mlx5_2,mlx5_3,mlx5_4,mlx5_5,mlx5_6,mlx5_7"
    NCCL_IB_GID_INDEX: 3
    NCCL_IB_TC: 160
    NCCL_IB_SL: 0
    NCCL_NET_GDR_LEVEL: 5 # GPU Direct RDMA across NVLink + InfiniBand
    NCCL_CROSS_NIC: 1
    NCCL_BUFFSIZE: 8388608 # 8MB ring buffer

gradient_synchronization:
  bucket_cap_mb: 25
  gradient_accumulation_steps: 4
  find_unused_parameters: false
  overlap_comm_compute: true

pipeline_parallel:
  schedule: "1F1B" # One-Forward-One-Backward interleaved schedule
  microbatch_size: 2
  num_microbatches: 16
