version: '3.8'

# =============================================================================
# 404 FOUNDERS — Development Docker Compose
# Orchestrates local development backend, frontend, and shared volumes
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: founders-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "50051:50051"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./logs:/app/logs
    environment:
      - FOUNDERS_ENV=development
      - FOUNDERS_LOG_LEVEL=INFO
      - FOUNDERS_MEMORY_BUDGET_GB=3.5
      - FOUNDERS_DB_PATH=/app/data/memory.db
      - FOUNDERS_DEFAULT_USER=operator
      - FOUNDERS_DEFAULT_EMAIL=operator@404founders.local
    networks:
      - founders-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: founders-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - HOST=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - founders-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  founders-network:
    driver: bridge
