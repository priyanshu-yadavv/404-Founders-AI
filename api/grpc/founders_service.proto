syntax = "proto3";

package founders.ai.v1;

option go_package = "founders/ai/v1";
option java_package = "com.founders.ai.v1";

// -----------------------------------------------------------------------------
// Neural Inference Service: High-throughput cluster token generation
// -----------------------------------------------------------------------------
service NeuralInferenceService {
  rpc GenerateTokens (InferenceRequest) returns (stream TokenChunk);
  rpc EmbedSequence (EmbeddingRequest) returns (EmbeddingResponse);
}

message InferenceRequest {
  repeated int32 token_ids = 1;
  int32 max_new_tokens = 2;
  float temperature = 3;
  string mode = 4;
  string session_id = 5;
}

message TokenChunk {
  int32 token_id = 1;
  string token_piece = 2;
  float logprob = 3;
  bool is_finished = 4;
}

message EmbeddingRequest {
  repeated int32 token_ids = 1;
}

message EmbeddingResponse {
  repeated float embedding_vector = 1;
  int32 dimension = 2;
}

// -----------------------------------------------------------------------------
// Cluster Telemetry Service: Real-time GPU & node health
// -----------------------------------------------------------------------------
service ClusterTelemetryService {
  rpc GetClusterVitals (ClusterQuery) returns (ClusterTelemetryResponse);
}

message ClusterQuery {
  string cluster_tier = 1; // "tier_a", "tier_b", "tier_c"
}

message ClusterTelemetryResponse {
  string tier_name = 1;
  int32 total_nodes = 2;
  int32 total_gpus = 3;
  float total_tflops_fp16 = 4;
  float total_vram_gb = 5;
  string status = 6;
}

// -----------------------------------------------------------------------------
// Task Dispatch Service: Cluster job scheduling and coordination
// -----------------------------------------------------------------------------
service TaskDispatchService {
  rpc DispatchTask (TaskPayload) returns (TaskReceipt);
}

message TaskPayload {
  string task_id = 1;
  string task_type = 2;
  string parameters_json = 3;
}

message TaskReceipt {
  string task_id = 1;
  string status = 2;
  string assigned_node = 3;
  string timestamp = 4;
}
