version: '3.8'

# =============================================================================
# 404 FOUNDERS — Production Docker Compose Architecture
# Deploys hardened backend, frontend, and Nginx reverse proxy with resource guards
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: founders-prod-backend
    restart: always
    expose:
      - "8000"
      - "50051"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    environment:
      - FOUNDERS_ENV=production
      - FOUNDERS_LOG_LEVEL=WARNING
      - FOUNDERS_MEMORY_BUDGET_GB=6.0
      - FOUNDERS_DB_PATH=/app/data/memory.db
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8192M
        reservations:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - founders-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: founders-prod-frontend
    restart: always
    expose:
      - "5173"
    environment:
      - PORT=5173
      - HOST=0.0.0.0
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - founders-prod-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:alpine
    container_name: founders-prod-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - founders-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  founders-prod-network:
    driver: bridge
