[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "founders404"
version = "0.2.0"
description = "Custom Multimodal Foundation AI & Personal Operating Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "404 FOUNDERS Core Architecture Team" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]
train-cpu = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]
train-gpu = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "grpcio>=1.62.0",
    "protobuf>=4.25.0",
]
personal-ai = [
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "neural_architecture*",
    "memory*",
    "multimodal*",
    "tokenizer*",
    "learning*",
    "training*",
    "personal_ai*",
    "agent*",
    "api*",
    "infrastructure*",
    "database*",
    "security*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["torch.*", "jax.*", "jaxlib.*", "psutil.*", "grpc.*"]
ignore_missing_imports = true
